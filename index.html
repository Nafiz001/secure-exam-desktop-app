<!DOCTYPE html>
<html>
<head>
  <title>Secure Exam App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #020617;
      color: white;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
    }

    .active {
      display: flex;
    }

    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .top-bar {
      padding: 10px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
    }

    .warning {
      background: red;
      padding: 10px;
      display: none;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="screen active">
    <div class="center">
      <h1>Secure Exam System</h1>
      <p>Please login to start the exam</p>
      <button onclick="startExam()">Login</button>
    </div>
  </div>

  <!-- EXAM SCREEN -->
  <div id="examScreen" class="screen">
    <div class="top-bar">
      <div>Exam Running</div>
      <div>Violations: <span id="count">0</span></div>
    </div>

    <div class="center">
      <div id="warningBox" class="warning">
        ⚠️ Violation Detected
      </div>

      <h2>Exam In Progress</h2>
      <p>Do not leave the exam window.</p>
    </div>
  </div>

  <script>
    let violations = 0;
    let examEnded = false;

    function startExam() {
      examEnded = false;
      violations = 0;
      document.getElementById("count").innerText = "0";
      window.electronAPI.startExam();

      document.getElementById("loginScreen").classList.remove("active");
      document.getElementById("examScreen").classList.add("active");
    }

    window.electronAPI.onViolation((event, data) => {
      if (examEnded) return;

      violations = data.count;
      document.getElementById("count").innerText = violations;

      const box = document.getElementById("warningBox");
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 3000);
    });

    window.electronAPI.onForceSubmit(() => {
      if (examEnded) return;
      examEnded = true;

      alert("Exam auto-submitted due to multiple violations.");

      document.getElementById("examScreen").classList.remove("active");
      document.getElementById("loginScreen").classList.add("active");
    });
  </script>

</body>
</html>
