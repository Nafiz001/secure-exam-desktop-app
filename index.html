<!DOCTYPE html>
<html>
<head>
  <title>Secure Exam App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #020617;
      color: white;
    }

    .top-bar {
      background: #0f172a;
      padding: 10px;
      display: flex;
      justify-content: space-between;
    }

    .warning {
      background: red;
      padding: 10px;
      display: none;
      text-align: center;
    }

    .content {
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>Secure Exam</div>
    <div>Warnings: <span id="count">0</span></div>
  </div>

  <div id="warningBox" class="warning">
    ⚠️ Violation Detected! Do not leave the exam window.
  </div>

  <div class="content">
    <h1>Exam In Progress</h1>
    <p>Do not switch tabs or exit fullscreen.</p>
  </div>

  <script>
    let violations = 0;

    window.electronAPI.onViolation((event, data) => {
      violations++;
      document.getElementById("count").innerText = violations;

      const box = document.getElementById("warningBox");
      box.style.display = "block";

      setTimeout(() => {
        box.style.display = "none";
      }, 3000);

      console.log("Violation:", data.type);
    });
  </script>

</body>
</html>
