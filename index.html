<!DOCTYPE html>
<html>
<head>
  <title>Invigilo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #020617;
      color: white;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
    }

    .active { display: flex; }

    .top-bar {
      padding: 10px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
    }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .warning {
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 6px;
      display: none;
      font-weight: bold;
    }

    .medium { background: #b45309; }
    .high { background: #991b1b; }

    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="center">
    <h1>Invigilo</h1>
    <button onclick="startExam()">Start Exam</button>
  </div>
</div>

<div id="examScreen" class="screen">
  <div class="top-bar">
    <div>Exam Running</div>
    <div>Violations: <span id="count">0</span></div>
  </div>

  <div class="center">
    <div id="warningBox" class="warning"></div>
    <h2>Exam In Progress</h2>
  </div>
</div>

<script>
  let examEnded = false;

  function startExam() {
    examEnded = false;
    document.getElementById("count").innerText = "0";
    window.electronAPI.startExam();

    document.getElementById("loginScreen").classList.remove("active");
    document.getElementById("examScreen").classList.add("active");
  }

  window.electronAPI.onViolation((event, data) => {
    if (examEnded) return;

    document.getElementById("count").innerText = data.count;

    const box = document.getElementById("warningBox");
    box.className = `warning ${data.severity}`;
    box.innerText = `⚠ ${data.severity.toUpperCase()} RISK: ${data.type}`;
    box.style.display = "block";

    setTimeout(() => box.style.display = "none", 4000);
  });

  window.electronAPI.onForceSubmit(() => {
    examEnded = true;
    alert("Exam auto-submitted due to forbidden application.");
    document.getElementById("examScreen").classList.remove("active");
    document.getElementById("loginScreen").classList.add("active");
  });
</script>

</body>
</html>
